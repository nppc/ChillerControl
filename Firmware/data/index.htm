<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cooler Box Controller</title>
<link href="webpage.css" rel="stylesheet" type="text/css">
<script src="main.js" defer></script>
</head>
<body>
<div class="container">
<table class="hdr_table">
<tr><td class="hdr_caption" id="Caption">Main Info</td>
<td class="hdr_logo">
<div class="hdr_logo_text_short">COOLER</div>
<div class="hdr_logo_text_long">Peltie Voltage Controller</div>
</td></tr></table>
<TABLE width=100%><TR><TD><div align="left">Version: <span id="FW">--</span></div></TD><TD><div align="right">Uptime: <div id="CurTime" style="display:inline">--</div></div></TD></TR></TABLE>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD>Temperature (&deg;C)</TD></TR>
<TR><TD><div style="font-size:100px" id="boxTemp">--</div>Set to: <div id="setTemp" style="display:inline">--</div></TD></TR>
</TABLE>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD>Hot PWM</TD><TD>Cold Volt</TD><TD>Cold Curr</TD><TD>Hot side</TD></TR>
<TR><TD id="setHotPWM">--</TD><TD id="Voltage">--</TD><TD id="Current">--</TD><TD id="Fan"><div style="display:inline" id="HotTemp">--</div>&deg;&nbsp;C</TD></TR>
</TABLE>
<div style="line-height:3" id="I2CStatus">--</div>
<TABLE width="100%"><TR>
<TD><button type="button" class="btn btn_round" onclick="showhide()">Temperature</button></TD>
<TD><form action="/settings" method="get"><button type="submit" class="btn btn_round">Settings</button></form></TD>
<TD><form id="stopForm" action="/stop" method="get"><button type="submit" class="btn btn_round btn_red">STOP</button></form></TD></TR>
</TABLE>
<div id="settemperature" style="display:none;">
<form id="setTempForm" action="/setTemp" method="get">
<TABLE>
<tr class="values_header"><td colspan=4>Set Temperature</td></tr>
<tr><td width=80px><button type="button" class="btn btn_minus" onclick="NumberChange(-10,'Temp')">&#171;</button></td>
<td width=80px, style="text-align: center; border-top: 1px solid #0ae;border-bottom: 1px solid #0ae">
<input type="number" name="Temp" id="Temp" class="input" min="0.0" max="45.0" step="0.1" placeholder="(&deg;C)" value=""/></td>
<td width=80px><button type="button" class="btn btn_plus" onclick="NumberChange(10,'Temp')">&#187;</button></td>
<td width=100px><button type="submit" class="btn btn_round">Set</button></td></tr>
</TABLE>
</form>
</div>
</div>
</body>
</html>
