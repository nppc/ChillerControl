<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cooler Box Controller</title>
<link href="webpage.css" rel="stylesheet" type="text/css">
<script src="main.js" defer></script>
</head>
<body>
<div class="container">
<table class="hdr_table">
<tr><td class="hdr_caption" id="Caption">Debug</td>
<td class="hdr_logo">
<div class="hdr_logo_text_short">COOLER</div>
<div class="hdr_logo_text_long">Peltie Voltage Controller</div>
</td></tr></table>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD colspan=2>Diagnostics</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Free RAM</TD><TD style="text-align:right;" id="freeHeap">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Wi-Fi Signal (RSSI)</TD><TD style="text-align:right;" id="wifiRssi">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">External Wi-Fi IP</TD><TD style="text-align:right;" id="wifiIp">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Last Wi-Fi Drop</TD><TD style="text-align:right;" id="lastWifiDrop">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">I2C Buck Converter</TD><TD style="text-align:right;" id="i2cStatus">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Reset Reason</TD><TD style="text-align:right;" id="resetReason">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Sensors</TD><TD style="text-align:right;" id="sensorCount">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Uptime</TD><TD style="text-align:right;" id="dbgUptime">--</TD></TR>
</TABLE>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD class="debug-header-cell"><span>Debug Log</span><button type="button" id="copyDebugBtn" class="copy-btn" title="Copy to clipboard" aria-label="Copy debug log to clipboard"><svg class="copy-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="copy-feedback">Copied!</span></button></TD></TR>
<TR><TD><pre id="debugLog" style="font-family:monospace;text-align:left;overflow-x:auto;">Loading...</pre></TD></TR>
</TABLE>
<BR>
<TABLE width="100%">
<TR><TD><button type="button" id="refreshDebugBtn" class="btn btn_round">Refresh</button></TD></TR>
</TABLE>
<BR>
</div>
</body>
</html>
