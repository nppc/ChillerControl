<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cooler Box Controller</title>
<link href="webpage.css" rel="stylesheet" type="text/css">
<script src="main.js" defer></script>
</head>
<body>
<div class="container">
<table class="hdr_table">
<tr><td class="hdr_caption" id="Caption">Debug</td>
<td class="hdr_logo">
<div class="hdr_logo_text_short">COOLER</div>
<div class="hdr_logo_text_long">Peltie Voltage Controller</div>
</td></tr></table>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD colspan=2>Diagnostics</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Free RAM</TD><TD style="text-align:right;" id="freeHeap">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Wi-Fi Signal (RSSI)</TD><TD style="text-align:right;" id="wifiRssi">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">External Wi-Fi IP</TD><TD style="text-align:right;" id="wifiIp">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Last Wi-Fi Drop</TD><TD style="text-align:right;" id="lastWifiDrop">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">I2C Buck Converter</TD><TD style="text-align:right;" id="i2cStatus">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Reset Reason</TD><TD style="text-align:right;" id="resetReason">--</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Sensors</TD><TD style="text-align:right;" id="sensorCount">--</TD></TR>
</TABLE>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD colspan=2>PID Diagnostic Fast Capture</TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">HTTP Endpoint</TD><TD style="text-align:right;"><div style="display:flex; justify-content:flex-end; align-items:center; gap:6px;"><input type="text" id="pidCaptureUrl" placeholder="http://192.168.1.X:8080/pid" style="flex:1; min-width:140px; max-width:250px; box-sizing:border-box; padding:4px;"><button type="button" id="pidCaptureSaveUrlBtn" class="btn btn_action_control" style="width:auto; min-width:52px; height:28px; padding:0 10px; font-size:12px;">Save</button></div></TD></TR>
<TR><TD style="text-align:left; font-weight:bold;">Status</TD><TD style="text-align:right;"><span id="pidCaptureStatus">Stopped</span> &bull; <span id="pidCaptureStats">0 pkts / 0 rows</span></TD></TR>
<TR><TD colspan=2 style="padding:10px 0;">
<div style="display:flex; justify-content:center; align-items:center; gap:10px;">
<button type="button" id="pidCaptureStartBtn" class="btn btn_action_control btn_green" style="width:auto; min-width:110px;">Start Capture</button>
<button type="button" id="pidCaptureStopBtn" class="btn btn_action_control btn_red" disabled style="width:auto; min-width:110px;">Stop Capture</button>
</div>
</TD></TR>
</TABLE>
<BR>
<TABLE class="values_table">
<TR class="values_header"><TD class="debug-header-cell"><span>Debug Log</span><button type="button" id="copyDebugBtn" class="copy-btn" title="Copy to clipboard" aria-label="Copy debug log to clipboard"><svg class="copy-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span class="copy-feedback">Copied!</span></button></TD></TR>
<TR><TD><pre id="debugLog" style="font-family:monospace;text-align:left;overflow-x:auto;">Loading...</pre></TD></TR>
<TR><TD class="debug-filters-cell">
<div class="debug-filters-bar">
<label class="debug-filter-item" for="logWifi"><input type="checkbox" id="logWifi"><span>Wi-Fi / Connection</span></label>
<label class="debug-filter-item" for="logPid"><input type="checkbox" id="logPid"><span>PID Regulation</span></label>
<label class="debug-filter-item" for="logIot"><input type="checkbox" id="logIot"><span>IoT Connectivity</span></label>
<label class="debug-filter-item" for="logSensors"><input type="checkbox" id="logSensors"><span>Peripherals &amp; Sensors</span></label>
</div>
</TD></TR>
</TABLE>
<BR>
<TABLE width="100%">
<TR><TD><button type="button" id="refreshDebugBtn" class="btn btn_round">Refresh</button></TD></TR>
</TABLE>
<BR>
</div>
</body>
</html>
