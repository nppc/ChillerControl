<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cooler Box Controller</title>
<link href="webpage.css" rel="stylesheet" type="text/css">
<script src="main.js" defer></script>
</head>
<body>
<div class="container">
<table class="hdr_table">
<tr><td class="hdr_caption" id="Caption">PID Settings</td>
<td class="hdr_logo">
<div class="hdr_logo_text_short">COOLER</div>
<div class="hdr_logo_text_long">Peltie Voltage Controller</div>
</td></tr></table>
<BR>
<form action="/pids_store" method="get">
<TABLE class="values_table">
<BR>
<tr class="values_header"><td colspan=4>Hot PIDs</td></tr>
<tr><td width=80px height=60px><button type="button" class="btn btn_minus" onclick="NumberChange(-10,'hotPID_kP')">&#171;</button></td>
<td width=80px, style="text-align: center; border-top: 1px solid #0ae;border-bottom: 1px solid #0ae">
<input type="number" name="hotPID_kP" id="hotPID_kP" class="input" min="0.0" max="300.0" step="0.1" value="0.0"/></td>
<td width=80px><button type="button" class="btn btn_plus" onclick="NumberChange(10,'hotPID_kP')">&#187;</button></td>
<TD>P</TD></tr>
<tr><td width=80px height=60px><button type="button" class="btn btn_minus" onclick="NumberChange(-1,'hotPID_kI')">&#171;</button></td>
<td width=80px, style="text-align: center; border-top: 1px solid #0ae;border-bottom: 1px solid #0ae">
<input type="number" name="hotPID_kI" id="hotPID_kI" class="input" min="0.0" max="100.0" step="0.001" value="0.0"/></td>
<td width=80px><button type="button" class="btn btn_plus" onclick="NumberChange(10,'hotPID_kI')">&#187;</button></td>
<TD>I</TD></tr>
<tr><td width=80px height=60px><button type="button" class="btn btn_minus" onclick="NumberChange(-10,'hotPID_kD')">&#171;</button></td>
<td width=80px, style="text-align: center; border-top: 1px solid #0ae;border-bottom: 1px solid #0ae">
<input type="number" name="hotPID_kD" id="hotPID_kD" class="input" min="0.0" max="300.0" step="0.1" value="0.0"/></td>
<td width=80px><button type="button" class="btn btn_plus" onclick="NumberChange(10,'hotPID_kD')">&#187;</button></td>
<TD>D</TD></tr>
</TABLE>
<BR>
<TABLE width="100%">
<TR><TD><button type="submit" class="btn btn_round">Save PIDs</button></TD></TR>
</TABLE>
</form>
<BR>
<div style="border: 1px solid #DDDDDD; padding: 10px; margin-top: 15px; background: #fff;">
<div class="values_header" style="margin: -10px -10px 10px -10px; padding: 8px;">Heating Autotune (Relay / Tyreus-Luyben)</div>
<table style="width: 100%; margin-bottom: 10px;">
<tr>
  <td style="text-align: left; padding: 5px;">Target Temp (&deg;C):</td>
  <td style="text-align: right; padding: 5px;">
    <input type="number" id="atTargetTemp" class="input" min="5.0" max="40.0" step="0.5" style="width: 80px; text-align: center;" />
  </td>
</tr>
</table>
<button type="button" id="btnAutotune" class="btn btn_round btn_green" onclick="toggleAutotune()">Start Autotune</button>
<div id="atStatusBox" style="margin-top: 10px; font-size: 14px; text-align: center; color: #333;">Status: Idle</div>
<div id="atDetailsBox" style="margin-top: 5px; font-size: 12px; text-align: center; color: #666;"></div>
</div>
</div>
</body>
</html>
